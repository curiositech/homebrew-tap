name: Update formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
  schedule:
    # Credential-independent backstop. A Port Daddy release cannot be stranded
    # by an expired cross-repository token; the tap discovers and verifies the
    # latest stable evidence itself within ten minutes.
    - cron: '*/10 * * * *'

concurrency:
  group: port-daddy-formula-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release identity
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
          PAYLOAD_DARWIN_SHA256: ${{ github.event.client_payload.darwin_archive_sha256 }}
          PAYLOAD_LINUX_SHA256: ${{ github.event.client_payload.linux_archive_sha256 }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "repository_dispatch" ]; then
            EVIDENCE="$RUNNER_TEMP/port-daddy-latest.json"
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
              https://github.com/curiositech/port-daddy/releases/latest/download/latest.json \
              -o "$EVIDENCE"
            PAYLOAD_VERSION="$(jq -er '.tag' "$EVIDENCE")"
            PAYLOAD_DARWIN_SHA256="$(jq -er '.artifacts[] | select(.filename == "pd-darwin-arm64.tar.gz") | .sha256' "$EVIDENCE")"
            PAYLOAD_LINUX_SHA256="$(jq -er '.artifacts[] | select(.filename == "pd-linux-x64.tar.gz") | .sha256' "$EVIDENCE")"
            # The tag ref is an authority independent of the release assets.
            # Use its peeled commit to verify BOTH imprints below; deriving the
            # candidate from an imprint would make that half of the check circular.
            TAG_OBJECT_TYPE="$(gh api "repos/curiositech/port-daddy/git/ref/tags/${PAYLOAD_VERSION}" --jq '.object.type')"
            TAG_OBJECT_SHA="$(gh api "repos/curiositech/port-daddy/git/ref/tags/${PAYLOAD_VERSION}" --jq '.object.sha')"
            if [ "$TAG_OBJECT_TYPE" = "tag" ]; then
              PAYLOAD_CANDIDATE_SHA="$(gh api "repos/curiositech/port-daddy/git/tags/${TAG_OBJECT_SHA}" --jq '.object.sha')"
            elif [ "$TAG_OBJECT_TYPE" = "commit" ]; then
              PAYLOAD_CANDIDATE_SHA="$TAG_OBJECT_SHA"
            else
              echo "::error::release tag resolved to unsupported Git object type ${TAG_OBJECT_TYPE}"
              exit 1
            fi
          fi
          [[ "$PAYLOAD_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Homebrew accepts stable Port Daddy release tags only"; exit 1;
          }
          [[ "$PAYLOAD_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::missing or invalid candidate SHA"; exit 1;
          }
          [[ "$PAYLOAD_DARWIN_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::missing or invalid Darwin archive digest"; exit 1;
          }
          [[ "$PAYLOAD_LINUX_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::missing or invalid Linux archive digest"; exit 1;
          }
          VERSION="${PAYLOAD_VERSION#v}"
          {
            echo "version=${VERSION}"
            echo "tag=${PAYLOAD_VERSION}"
            echo "candidate_sha=${PAYLOAD_CANDIDATE_SHA}"
            echo "darwin_sha256=${PAYLOAD_DARWIN_SHA256}"
            echo "linux_sha256=${PAYLOAD_LINUX_SHA256}"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify candidate-bound release evidence
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
          CANDIDATE_SHA: ${{ steps.vars.outputs.candidate_sha }}
          EXPECTED_DARWIN_SHA256: ${{ steps.vars.outputs.darwin_sha256 }}
          EXPECTED_LINUX_SHA256: ${{ steps.vars.outputs.linux_sha256 }}
        run: |
          set -euo pipefail
          BASE="https://github.com/curiositech/port-daddy/releases/download/${TAG}"
          ASSETS="$RUNNER_TEMP/port-daddy-release-evidence"
          mkdir -p "$ASSETS"

          curl -fsSL "${BASE}/pd-darwin-arm64.tar.gz" -o "$ASSETS/pd-darwin-arm64.tar.gz"
          curl -fsSL "${BASE}/pd-darwin-arm64-imprint.json" -o "$ASSETS/pd-darwin-arm64-imprint.json"
          curl -fsSL "${BASE}/pd-linux-x64.tar.gz" -o "$ASSETS/pd-linux-x64.tar.gz"
          curl -fsSL "${BASE}/pd-linux-x64-imprint.json" -o "$ASSETS/pd-linux-x64-imprint.json"

          python3 scripts/verify-port-daddy-release-evidence.py \
            --version "$TAG" \
            --candidate-sha "$CANDIDATE_SHA" \
            --darwin-expected-sha256 "$EXPECTED_DARWIN_SHA256" \
            --linux-expected-sha256 "$EXPECTED_LINUX_SHA256" \
            --assets-dir "$ASSETS" \
            --github-output "$GITHUB_OUTPUT"

          # v3.30.3 is the first release whose archives carry GitHub/Sigstore
          # build-provenance attestations. Enforce the artifact bytes, source
          # tag + commit, signer workflow, and hosted-runner boundary before
          # those digests can reach the formula. The v3.30.2 legacy allowance
          # is exact and can never weaken later releases.
          # https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations
          MIN_ATTESTED_VERSION="3.30.3"
          if [ "$(printf '%s\n%s\n' "$MIN_ATTESTED_VERSION" "$VERSION" | sort -V | head -n 1)" = "$MIN_ATTESTED_VERSION" ]; then
            for archive in pd-darwin-arm64.tar.gz pd-linux-x64.tar.gz; do
              gh attestation verify "$ASSETS/$archive" \
                --repo curiositech/port-daddy \
                --signer-workflow curiositech/port-daddy/.github/workflows/release.yml \
                --source-ref "refs/tags/${TAG}" \
                --source-digest "$CANDIDATE_SHA" \
                --deny-self-hosted-runners
            done
          else
            echo "::notice::${TAG} predates the v3.30.3 provenance boundary; checksum and dual-imprint verification remain enforced."
          fi

          # pd-console.app — only present from the release that first shipped the
          # build-pd-console-app job (#493). Tolerate its absence so older / daemon-
          # only releases still roll the formula instead of failing the whole run.
          if curl -fsSL "${BASE}/PortDaddy-Console-macOS-arm64.zip" -o console.zip; then
            CONSOLE=$(sha256sum console.zip | awk '{print $1}')
          else
            CONSOLE=""
            echo "::notice::no pd-console.app in ${TAG} — skipping cask refresh"
          fi

          echo "console=${CONSOLE}" >> "$GITHUB_OUTPUT"

      - name: Update formula
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ARM64: ${{ steps.sha.outputs.arm64 }}
          LINUX: ${{ steps.sha.outputs.linux }}
        run: |
          FORMULA="Formula/port-daddy.rb"

          # Update version
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" "$FORMULA"
          # Formula revisions apply only to the old upstream version. A new
          # Port Daddy release always starts at revision zero.
          sed -i '/^[[:space:]]*revision [0-9][0-9]*$/d' "$FORMULA"

          # Update sha256 placeholders / previous values.
          # Body of the heredoc MUST be indented at the YAML literal-block
          # indent level (10 spaces here) so the surrounding `run: |` keeps
          # parsing. Without that, YAML treats the first column-0 line as a
          # block exit and the whole workflow file fails to parse — which is
          # how this file shipped broken for three days, with every
          # repository_dispatch silently dropped.
          python3 - <<'PYEOF'
          import os, re

          formula = open("Formula/port-daddy.rb").read()
          arm64 = os.environ["ARM64"]
          linux = os.environ["LINUX"]

          # The formula only has two sha256 lines (darwin-arm64 then linux-x64).
          # darwin-x64 was dropped from the release matrix on 2026-05-22 because
          # macos-13 GHA runners routinely wedge for 24h. Don't touch a third
          # match; there isn't one.
          def replace_nth_sha(text, n, new_sha):
              matches = list(re.finditer(r'sha256 "[a-fA-F0-9]+"', text))
              if len(matches) < n:
                  matches = list(re.finditer(r'sha256 "PLACEHOLDER_[A-Z0-9_]+"', text))
              if len(matches) < n:
                  return text
              m = matches[n - 1]
              return text[:m.start()] + f'sha256 "{new_sha}"' + text[m.end():]

          formula = replace_nth_sha(formula, 1, arm64)   # darwin-arm64
          formula = replace_nth_sha(formula, 2, linux)   # linux-x64

          open("Formula/port-daddy.rb", "w").write(formula)
          PYEOF

      - name: Update console cask
        if: steps.sha.outputs.console != ''
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          CONSOLE: ${{ steps.sha.outputs.console }}
        run: |
          CASK="Casks/port-daddy-console.rb"
          # The cask has exactly one version line and one sha256 line — a plain
          # sed is sufficient (no nth-match dance like the formula).
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" "$CASK"
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"${CONSOLE}\"/" "$CASK"

      - name: Commit and push
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/port-daddy.rb Casks/port-daddy-console.rb
          # Casks/ only changes on releases that shipped a console .app; commit
          # whatever is staged, and no-op cleanly if nothing changed.
          if git diff --cached --quiet; then
            echo "Formula already matches v${VERSION}; nothing to publish."
          else
            git commit -m "chore: bump port-daddy to v${VERSION}"
            git push
          fi
